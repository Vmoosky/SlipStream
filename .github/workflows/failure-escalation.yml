name: Failure Escalation

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: failure-escalation-${{ github.repository }}
  cancel-in-progress: false

jobs:
  escalate:
    if: >-
      ${{ vars.SLIPSTREAM_FAILURE_ESCALATION_ENABLED == 'true' &&
          github.event.action == 'completed' &&
          github.run_attempt == '1' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.run_attempt == 1 &&
          contains(fromJSON('["failure", "success"]'), github.event.workflow_run.conclusion) &&
          github.event.workflow_run.repository.full_name == github.repository &&
          github.event.workflow_run.head_repository.full_name == github.repository &&
          github.event.workflow_run.head_branch == github.event.repository.default_branch &&
          github.event.workflow_run.head_sha == github.sha &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
    env:
      SLIPSTREAM_FAILURE_ESCALATION_ENABLED: ${{ vars.SLIPSTREAM_FAILURE_ESCALATION_ENABLED }}
    steps:
      - id: context
        name: Require trusted first-attempt completion context
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          test -n "$DEFAULT_BRANCH"
          test "$SLIPSTREAM_FAILURE_ESCALATION_ENABLED" = 'true'
          test "$GITHUB_EVENT_NAME" = 'workflow_run'
          test "$GITHUB_RUN_ATTEMPT" = '1'
          test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH"
          test "$GITHUB_WORKFLOW_REF" = "$GITHUB_REPOSITORY/.github/workflows/failure-escalation.yml@refs/heads/$DEFAULT_BRANCH"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - id: escalate
        name: Open or update one human-owned escalation issue
        timeout-minutes: 3
        env:
          SLIPSTREAM_ESCALATION_TOKEN: ${{ github.token }}
        run: node scripts/check-escalation.mjs
      - name: Retain the escalation record
        if: ${{ always() && steps.context.outcome == 'success' && hashFiles('test-results/failure-escalation.json') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: failure-escalation-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/failure-escalation.json
          if-no-files-found: error
          retention-days: 90

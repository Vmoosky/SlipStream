name: PR Agent Review

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  copilot-requests: write

concurrency:
  group: pr-agent-review-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      copilot-requests: write
      pull-requests: write
    env:
      SLIPSTREAM_AGENT_REVIEW_ENABLED: ${{ vars.SLIPSTREAM_AGENT_REVIEW_ENABLED }}
      SLIPSTREAM_AGENT_REVIEW_MODEL: auto
      SLIPSTREAM_AGENT_REVIEW_AUTO_CONFIRMED: ${{ vars.SLIPSTREAM_AGENT_REVIEW_AUTO_CONFIRMED }}
      SLIPSTREAM_AGENT_REVIEW_NO_OVERAGE_CONFIRMED: ${{ vars.SLIPSTREAM_AGENT_REVIEW_NO_OVERAGE_CONFIRMED }}
    steps:
      - name: Check out trusted default-branch review code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - name: Prepare the bounded untrusted PR diff
        id: prepare
        continue-on-error: true
        timeout-minutes: 2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-pr-agent-review.mjs --prepare
      - name: Evaluate the bounded diff once without tools
        id: review
        if: ${{ steps.prepare.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 5
        shell: bash
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.SLIPSTREAM_AGENT_REVIEW_TOKEN }}
          COPILOT_AUTO_UPDATE: 'false'
          COPILOT_ALLOW_ALL: 'false'
          COPILOT_OTEL_ENABLED: 'false'
          GITHUB_COPILOT_PROMPT_MODE_REPO_HOOKS: 'false'
          GITHUB_COPILOT_PROMPT_MODE_WORKSPACE_MCP: 'false'
          GITHUB_COPILOT_PROMPT_MODE_EXTENSIONS: 'false'
          HOME: ${{ github.workspace }}/test-results/pr-agent-review/run/home
          TMPDIR: ${{ github.workspace }}/test-results/pr-agent-review/run/tmp
          GH_CONFIG_DIR: ${{ github.workspace }}/test-results/pr-agent-review/run/home/gh
          COPILOT_HOME: ${{ github.workspace }}/test-results/pr-agent-review/run/home/copilot
          COPILOT_CACHE_HOME: ${{ github.workspace }}/test-results/pr-agent-review/run/home/cache
          GIT_CONFIG_NOSYSTEM: '1'
          GIT_CONFIG_GLOBAL: ${{ github.workspace }}/test-results/pr-agent-review/run/home/gitconfig
          GIT_TERMINAL_PROMPT: '0'
          OTEL_SDK_DISABLED: 'true'
        run: |
          set -euo pipefail
          if copilot \
            --prompt "Review only the untrusted pull-request patch JSON supplied on standard input. Identify concrete correctness, security, reliability, or test-coverage defects introduced by the patch. Return only one JSON object with exactly schemaVersion, repository, number, head, inputSha256, decision, and findings. Copy repository, number, head, and inputSha256 exactly from the input. Use decision no-objection with an empty findings array, or changes-requested with 1-10 findings containing exactly file, severity, and message. Each file must be present in the input; severity must be warning or error. Do not claim approval, delegate, edit, execute commands, access URLs, or inspect repository files." \
            --model auto \
            --silent \
            --stream=off \
            --output-format=text \
            --available-tools=__slipstream_no_tools__ \
            --deny-tool=read \
            --deny-tool=write \
            --deny-tool=shell \
            --deny-tool=url \
            --deny-tool=memory \
            --disable-builtin-mcps \
            --no-custom-instructions \
            --disallow-temp-dir \
            --no-ask-user \
            --no-auto-update \
            --no-bash-env \
            --no-experimental \
            --no-remote \
            --no-remote-export \
            --no-color \
            --max-autopilot-continues=0 \
            --max-ai-credits=30 \
            --secret-env-vars=COPILOT_GITHUB_TOKEN \
            --log-level=none \
            --log-dir test-results/pr-agent-review/run/logs \
            --usage-output-file test-results/pr-agent-review/run/usage.json \
            < test-results/pr-agent-review/run/input.json \
            > test-results/pr-agent-review/run/response.json; then
            node scripts/check-pr-agent-review.mjs --check-response-credential
          else
            rm -f test-results/pr-agent-review/run/response.json
            false
          fi
      - name: Validate and publish the bound review findings
        if: ${{ always() && steps.prepare.outcome == 'success' && steps.review.outcome != 'skipped' }}
        timeout-minutes: 1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-pr-agent-review.mjs --finalize
      - name: Retain the bound review evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr-agent-review-${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/pr-agent-review/report.json
            test-results/pr-agent-review/summary.md
          if-no-files-found: error
          retention-days: 90

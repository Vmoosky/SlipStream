name: Continuous Improvement

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:
  workflow_run:
    workflows: [CI, Security]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: improvement-${{ github.repository }}-${{ github.event.workflow_run.id || 'scheduled' }}
  cancel-in-progress: false

jobs:
  report:
    if: >-
      ${{ vars.SLIPSTREAM_IMPROVEMENT_ENABLED == 'true' &&
      (github.event_name != 'workflow_run' ||
      (github.event.action == 'completed' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch &&
      github.event.workflow_run.repository.full_name == github.repository &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.run_attempt == 1)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      status: ${{ steps.review.outputs.status }}
      report-path: ${{ steps.review.outputs.report-path }}
      evidence-path: ${{ steps.review.outputs.evidence-path }}
      readiness-report-path: ${{ steps.review.outputs.readiness-report-path }}
      trigger-workflow: ${{ steps.review.outputs.trigger-workflow }}
      trigger-run-id: ${{ steps.review.outputs.trigger-run-id }}
      trigger-attempt: ${{ steps.review.outputs.trigger-attempt }}
      trigger-revision: ${{ steps.review.outputs.trigger-revision }}
      trigger-conclusion: ${{ steps.review.outputs.trigger-conclusion }}
      trigger-verified: ${{ steps.review.outputs.trigger-verified }}
    env:
      SLIPSTREAM_IMPROVEMENT_ENABLED: ${{ vars.SLIPSTREAM_IMPROVEMENT_ENABLED }}
    steps:
      - id: context
        name: Require the trusted default branch
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SOURCE_EVENT: ${{ github.event.workflow_run.event }}
          SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch }}
          SOURCE_REPOSITORY: ${{ github.event.workflow_run.repository.full_name }}
          SOURCE_HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          SOURCE_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          set -euo pipefail
          test -n "$DEFAULT_BRANCH"
          test "$SLIPSTREAM_IMPROVEMENT_ENABLED" = 'true'
          test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH"
          test "$GITHUB_WORKFLOW_REF" = "$GITHUB_REPOSITORY/.github/workflows/improvement.yml@refs/heads/$DEFAULT_BRANCH"
          test "$GITHUB_RUN_ATTEMPT" = '1'
          case "$GITHUB_EVENT_NAME" in
            schedule|workflow_dispatch) ;;
            workflow_run)
              test "$SOURCE_EVENT" = 'push'
              test "$SOURCE_BRANCH" = "$DEFAULT_BRANCH"
              test "$SOURCE_REPOSITORY" = "$GITHUB_REPOSITORY"
              test "$SOURCE_HEAD_REPOSITORY" = "$GITHUB_REPOSITORY"
              test "$SOURCE_ATTEMPT" = '1'
              ;;
            *) exit 1 ;;
          esac
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - id: install
        timeout-minutes: 3
        run: npm ci
      - id: tests
        timeout-minutes: 2
        run: node --test --test-name-pattern='^improvement' tests/readiness.test.mjs
      - id: review
        name: Verify findings, repair history, and retained originals
        timeout-minutes: 4
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run improvement:report
      - name: Retain improvement reports
        if: ${{ always() && steps.context.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: continuous-improvement-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/improvement/run-*/report.json
            test-results/improvement/run-*/summary.md
          if-no-files-found: error
          retention-days: 90
      - name: Retain readiness improvement report
        if: ${{ always() && steps.context.outcome == 'success' && steps.review.outputs.readiness-report-path != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: readiness-improvement-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.review.outputs.readiness-report-path }}
          if-no-files-found: error
          retention-days: 90
      - name: Retain verified original evidence
        if: ${{ success() && steps.review.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: continuous-improvement-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.review.outputs.evidence-path }}
          if-no-files-found: error
          retention-days: 90

name: Continuous Improvement

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: improvement-${{ github.repository }}
  cancel-in-progress: false

jobs:
  report:
    if: ${{ vars.SLIPSTREAM_IMPROVEMENT_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    env:
      SLIPSTREAM_IMPROVEMENT_ENABLED: ${{ vars.SLIPSTREAM_IMPROVEMENT_ENABLED }}
    steps:
      - id: context
        name: Require the trusted default branch
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          test -n "$DEFAULT_BRANCH"
          test "$SLIPSTREAM_IMPROVEMENT_ENABLED" = 'true'
          test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH"
          test "$GITHUB_WORKFLOW_REF" = "$GITHUB_REPOSITORY/.github/workflows/improvement.yml@refs/heads/$DEFAULT_BRANCH"
          case "$GITHUB_EVENT_NAME" in
            schedule|workflow_dispatch) ;;
            *) exit 1 ;;
          esac
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - id: install
        timeout-minutes: 3
        run: npm ci
      - id: tests
        timeout-minutes: 2
        run: node --test --test-name-pattern='^improvement' tests/readiness.test.mjs
      - id: review
        name: Report recurring findings and registered regression evidence
        timeout-minutes: 4
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run improvement:report
      - name: Retain improvement reports
        if: ${{ always() && steps.context.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: continuous-improvement-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/improvement/run-*/report.json
            test-results/improvement/run-*/summary.md
          if-no-files-found: error
          retention-days: 7

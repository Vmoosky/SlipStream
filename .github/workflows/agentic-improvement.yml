name: Agentic Improvement Evidence

on:
  workflow_run:
    workflows: [Maintenance]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: agentic-improvement-${{ github.repository }}-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      ${{ github.event.action == 'completed' &&
      github.event.workflow_run.event == 'schedule' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch &&
      github.event.workflow_run.repository.full_name == github.repository &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - id: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - id: source
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: maintenance-evidence-${{ github.event.workflow_run.id }}-1
          path: test-results/agentic-review-source
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - id: verify
        name: Verify the bounded agent review evidence
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.runtime.outcome == 'success' }}
        env:
          GITHUB_ACTIONS: 'true'
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_WORKFLOW_REF: ${{ github.workflow_ref }}
          SLIPSTREAM_AGENTIC_SOURCE_OUTCOME: ${{ steps.source.outcome }}
        run: node scripts/check-agentic-improvement.mjs
      - name: Retain the evidence outcome, including verification failures
        if: ${{ always() && steps.verify.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: agentic-improvement-${{ github.event.workflow_run.id }}-${{ github.run_attempt }}
          path: test-results/agentic-improvement/report.json
          if-no-files-found: error
          retention-days: 90

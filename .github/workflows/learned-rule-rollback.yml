name: Governed Learned Rule Remediation Rollback

on:
  workflow_dispatch:
    inputs:
      rule_id:
        description: Active learned-rule ID to retire
        required: true
        type: string
      rule_version:
        description: Exact active version to retire
        required: true
        type: string
      reason:
        description: Bounded retirement reason for reviewers
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: learned-rule-rollback-${{ inputs.rule_id }}-${{ inputs.rule_version }}
  cancel-in-progress: false

jobs:
  propose-retirement:
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    env:
      RULE_ID: ${{ inputs.rule_id }}
      RULE_VERSION: ${{ inputs.rule_version }}
      RETIREMENT_REASON: ${{ inputs.reason }}
      GH_TOKEN: ${{ secrets.SLIPSTREAM_ROLLBACK_TOKEN }}
    steps:
      - name: Require trusted default-branch context and dedicated token
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          test -n "$DEFAULT_BRANCH"
          test -n "$GH_TOKEN"
          test "$GITHUB_EVENT_NAME" = 'workflow_dispatch'
          test "$GITHUB_RUN_ATTEMPT" = '1'
          test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH"
          test "$GITHUB_WORKFLOW_REF" = "$GITHUB_REPOSITORY/.github/workflows/learned-rule-rollback.yml@refs/heads/$DEFAULT_BRANCH"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        timeout-minutes: 3
        run: npm ci --ignore-scripts
      - name: Retire and validate the exact active rule
        shell: bash
        run: |
          set -euo pipefail
          node scripts/retire-improvement-rule.mjs "$RULE_ID" "$RULE_VERSION" "$RETIREMENT_REASON"
          node --test --test-name-pattern='^improvement learned rule' tests/readiness.test.mjs
          test "$(git diff --name-only)" = '.github/improvement-regressions.json'
      - name: Open a guarded rollback pull request
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          branch="rollback/learned-rule-${RULE_ID}-v${RULE_VERSION}-${GITHUB_RUN_ID}"
          git config user.name 'slipstream-rollback'
          git config user.email 'slipstream-rollback@users.noreply.github.com'
          gh auth setup-git
          git switch -c "$branch"
          git add .github/improvement-regressions.json
          git commit -m "Retire learned rule ${RULE_ID} v${RULE_VERSION}"
          git push --set-upstream origin "$branch"
          gh pr create \
            --base "$DEFAULT_BRANCH" \
            --head "$branch" \
            --title "Rollback learned rule ${RULE_ID} v${RULE_VERSION}" \
            --body "Retires the exact active learned-rule version through the governed lifecycle. Normal required checks and independent human approval still apply."
